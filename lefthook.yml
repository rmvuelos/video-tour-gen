commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    web-format:
      glob: 'apps/web/**/*.{ts,tsx,js,json,css,html}'
      run: pnpm exec prettier --check {staged_files}
    web-lint:
      root: apps/web/
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint {staged_files}

pre-push:
  commands:
    protect-main:
      use_stdin: true
      run: sh scripts/protect-main.sh
