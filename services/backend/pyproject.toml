[project]
name = "backend"
version = "0.1.0"
description = "video-tour-gen API (FastAPI) and worker (Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.7.0",
    "fastapi>=0.165.0",
    "packaging",
    "pydantic-settings>=2.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker"]
disallow_untyped_decorators = false
