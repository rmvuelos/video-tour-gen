[project]
name = "backend"
version = "0.1.0"
description = "video-tour-gen API (FastAPI) and worker (Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery>=5.7.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16",  # Storage client (runtime since the upload API)
    "pyjwt[crypto]>=2.10",
    "packaging>=24",  # kombu 5.7.0 imports it (kombu.transport.redis) but does not declare it
    "psycopg[binary,pool]>=3.2",
    "pillow>=12,<14",
    "pydantic-settings>=2.16",
    "pypdfium2>=5,<6",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pikepdf>=9.0",  # tests only (MPL-2.0): builds encrypted PDFs
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# integration tests need Supabase: CI runs them with `-m integration` in the db job
addopts = "--cov=app --cov-report=term-missing -m 'not integration'"
markers = ["integration: needs the local Supabase stack (DATABASE_URL, SUPABASE_*)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker"]
disallow_untyped_decorators = false
